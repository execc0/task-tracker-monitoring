global:
  scrape_interval: 15s

scrape_configs:

  - job_name: 'spring-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9090'] # Порт API


  - job_name: 'spring-bot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:9091'] # Порт Бота


  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']
